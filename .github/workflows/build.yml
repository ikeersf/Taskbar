name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar la Release al crear un tag

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Calcular versión
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = '0.0.0-dev'
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publicar (.exe autocontenido)
        run: dotnet publish src/TaskbarMin/TaskbarMin.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Generar instalador
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\TaskbarMin.iss'

      - name: Subir artefactos
        uses: actions/upload-artifact@v4
        with:
          name: TaskbarMin-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            publish/TaskbarMin.exe

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
